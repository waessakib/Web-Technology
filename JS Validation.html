<!DOCTYPE html>
<html>
<head>
<title>Simple Contact Form</title>
<style>
    .form-box {
      width: 400px;
      padding: 40px;
      border: 2px solid #000;
      border-radius: 6px;
    }
 
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      border: 1px solid #eb0202;
      border-radius: 3px;
      padding: 5px;
      margin-bottom: 5px;
    }
    textarea { height: 50px; }
 
    button {
      background-color: #0345b7;
      color: rgb(255, 255, 255);
      padding: 8px 15px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
 
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
 
    .note {
      background-color: #0633d7;
      color: rgb(243, 239, 239);
      padding: 6px;
      font-size: 14px;
      border-radius: 3px;
      margin-bottom: 20px;
      text-align: center;
    }
 
    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
    }
</style>
</head>
 
<body>
<div class="form-box">
<div class="note">Remember to fill in all fields!</div>
 
<form onsubmit="return validate(this);">
 
<label for="name">Name:</label>
<input type="text" id="name" name="name">
<span id="nameErr" class="error"></span>
 
<label for="email">Email:</label>
<input type="email" id="email" name="email">
<span id="emailErr" class="error"></span>
 
<label for="message">Message:</label>
<textarea id="message" name="message"></textarea>
<span id="messageErr" class="error"></span>
 
<label>
<input type="checkbox" name="subscribe" id="subscribe"> Subscribe to newsletter
</label>
<span id="checkErr" class="error"></span>
 
<button type="submit">Send</button>
</form>
</div>
 
<script>
function validate(form) {
 
  let valid = true;
 
  // Name validation
  if (form.name.value.trim() === "") {
    document.getElementById("nameErr").innerHTML = "Please enter your name";
    valid = false;
  } else {
    document.getElementById("nameErr").innerHTML = "";
  }
 
  // Email validation
  if (form.email.value.trim() === "") {
    document.getElementById("emailErr").innerHTML = "Please enter your email";
    valid = false;
  } else {
    document.getElementById("emailErr").innerHTML = "";
  }
 
  // Message validation
  if (form.message.value.trim() === "") {
    document.getElementById("messageErr").innerHTML = "Please write a message";
    valid = false;
  } else {
    document.getElementById("messageErr").innerHTML = "";
  }
 
  // Checkbox validation (optional)
  if (!form.subscribe.checked) {
    document.getElementById("checkErr").innerHTML = "You must agree to subscribe";
    valid = false;
  } else {
    document.getElementById("checkErr").innerHTML = "";
  }
 
  return valid;
}
</script>
 
</body>
</html>
