<!DOCTYPE html>
<html>
<head>
<title>Simple Contact Form</title>
<style>
 
 
    .form-box {
 
      width: 400px;
 
      padding: 40px;
 
      border: 2px solid #000;
 
      border-radius: 6px;
 
    }
 
    input[type="text"],
 
    input[type="email"],
 
    textarea {
 
      width: 100%;
 
      border: 1px solid #eb0202;
 
      border-radius: 3px;
 
      padding: 5px;
 
      margin-bottom: 20px;
 
    }
   
    textarea {
 
      height: 50px;
 
    }
 
    button {
 
      background-color: #0345b7;
 
      color: rgb(255, 255, 255);
 
      padding: 8px 15px;
 
      border: none;
 
      border-radius: 3px;
 
      cursor: pointer;
 
    }
 
    label {
 
      display: block;
 
      font-weight: bold;
 
      margin-bottom: 5px;
 
    }
 
    .note {
 
      background-color: #0633d7;
 
      color: rgb(243, 239, 239);
 
      padding: 6px;
 
      font-size: 14px;
 
      border-radius: 3px;
 
      margin-bottom: 20px;
 
      text-align: center;
 
    }
</style>
</head>
<body>
<div class="form-box">
<div class="note">Remember to fill in all fields!</div>
<form>
<label for="name">Name:</label>
<input type="text" id="name" name="name">
<label for="email">Email:</label>
<input type="email" id="email" name="email">
<label for="message">Message:</label>
<textarea id="message" name="message"></textarea>
<label>
<input type="checkbox" name="subscribe"> Subscribe to newsletter
</label>
<button type="submit">Send</button>
</form>
</div>
</body>
</html>
